<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felipe Bueno</title>
<meta name="description" content="Links do Felipe Bueno: LinkedIn, Instagram e Tinder.">
<meta property="og:title" content="Felipe Bueno">
<meta property="og:description" content="Engenheiro de dados. Jiu-jitsu nas horas vagas.">
<meta property="og:image" content="avatar.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efede6;
    --ink: #1c1b2b;
    --muted: #4a4858;
    --px: 3px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1b24;
      --ink: #ecebe3;
      --muted: #b4b2ab;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1b24;
    --ink: #ecebe3;
    --muted: #b4b2ab;
  }

  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    /* textura sutil de papel */
    background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  main {
    max-width: 30rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar {
    width: 7.5rem;
    height: 7.5rem;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: .01em;
    margin-bottom: .5rem;
  }

  .bio {
    font-size: .9rem;
    color: var(--muted);
    max-width: 26ch;
    line-height: 1.5;
    margin-bottom: 1.25rem;
  }

  .icons {
    display: flex;
    gap: 1.25rem;
    list-style: none;
    margin-bottom: 2.25rem;
  }
  .icons a {
    display: grid;
    place-items: center;
    width: 2.25rem;
    height: 2.25rem;
    color: var(--ink);
    border-radius: 6px;
    transition: transform .15s ease;
  }
  .icons a:hover { transform: translateY(-2px); }
  .icons svg { width: 1.6rem; height: 1.6rem; }

  .links {
    list-style: none;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
  }

  /* botão com borda "pixelada": cantos em degrau feitos com box-shadow */
  .btn {
    position: relative;
    display: block;
    width: calc(100% - 2 * var(--px));
    margin: 0 auto;
    padding: 1.15rem 1rem;
    color: var(--ink);
    background: var(--paper);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--ink),
      0 var(--px) 0 0 var(--ink),
      calc(-1 * var(--px)) 0 0 0 var(--ink),
      var(--px) 0 0 0 var(--ink),
      /* sombra deslocada embaixo, como na referência */
      0 calc(2 * var(--px)) 0 0 var(--ink);
    transition: transform .08s steps(2), box-shadow .08s steps(2);
  }
  .btn:hover {
    transform: translateY(calc(-1 * var(--px)));
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--ink),
      0 var(--px) 0 0 var(--ink),
      calc(-1 * var(--px)) 0 0 0 var(--ink),
      var(--px) 0 0 0 var(--ink),
      0 calc(3 * var(--px)) 0 0 var(--ink);
  }
  .btn:active {
    transform: translateY(var(--px));
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--ink),
      0 var(--px) 0 0 var(--ink),
      calc(-1 * var(--px)) 0 0 0 var(--ink),
      var(--px) 0 0 0 var(--ink);
  }

  a:focus-visible {
    outline: 2px dashed var(--ink);
    outline-offset: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .icons a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <img class="avatar" src="avatar.jpg" alt="Foto de Felipe Bueno" width="400" height="400">
  <h1>Felipe Bueno</h1>
  <p class="bio">Engenheiro de dados. <span style="white-space:nowrap">Jiu-jitsu</span> nas horas vagas.</p>

  <ul class="icons" aria-label="Redes">
    <li>
      <a href="https://www.linkedin.com/in/fcabueno/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M8 10.5V16M8 7.75v.01M11.5 16v-5.5M11.5 13c0-1.5 1-2.5 2.5-2.5s2 1 2 2.5V16"/>
        </svg>
      </a>
    </li>
    <li>
      <a href="https://www.instagram.com/fcabueno/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <path d="M17.5 6.5v.01"/>
        </svg>
      </a>
    </li>
    <li>
      <a href="https://tinder.com/@fcabueno" target="_blank" rel="noopener" aria-label="Tinder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21c-4 0-7-2.8-7-6.8 0-3.6 2.6-5.6 3.6-8.7.9 1.6 1.6 2.6 2.7 3.2C11.5 5.6 13.2 3.6 15.5 3c-.4 2.6.4 4.4 1.8 6.3 1 1.4 1.7 3 1.7 4.9 0 4-3 6.8-7 6.8z"/>
        </svg>
      </a>
    </li>
  </ul>

  <ul class="links">
    <li><a class="btn" href="https://www.linkedin.com/in/fcabueno/" target="_blank" rel="noopener">LinkedIn</a></li>
    <li><a class="btn" href="https://www.instagram.com/fcabueno/" target="_blank" rel="noopener">Instagram</a></li>
    <li><a class="btn" href="https://tinder.com/@fcabueno" target="_blank" rel="noopener">Tinder</a></li>
  </ul>
</main>
</body>
</html>
