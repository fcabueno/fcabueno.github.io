<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felipe Bueno</title>
<meta name="description" content="Links do Felipe Bueno: LinkedIn, Instagram e Tinder.">
<meta property="og:title" content="Felipe Bueno">
<meta property="og:description" content="Engenheiro de dados">
<meta property="og:image" content="avatar.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='black'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f3ee;
    --ink: #1c1b2b;
    --muted: #4a4858;
    --px: 3px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18171f;
      --ink: #ecebe3;
      --muted: #b4b2ab;
    }
  }
  :root[data-theme="dark"] {
    --paper: #18171f;
    --ink: #ecebe3;
    --muted: #b4b2ab;
  }

  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 30rem;
    margin: 0 auto;
    padding: 3rem 1.25rem;
    min-height: 100vh;
    min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .avatar {
    width: 7.5rem;
    height: 7.5rem;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -.01em;
    margin-bottom: .5rem;
  }

  .bio {
    font-size: .95rem;
    color: var(--muted);
        line-height: 1.5;
    margin-bottom: 2.25rem;
  }

  .links {
    list-style: none;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
  }

  /* botão com borda arredondada e sombra sólida deslocada embaixo */
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 1.15rem 3rem;
    color: var(--ink);
    background: var(--paper);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    border: var(--px) solid var(--ink);
    border-radius: 14px;
    box-shadow: 0 calc(2 * var(--px)) 0 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  /* ícone fixo na borda esquerda, texto continua centralizado */
  .btn svg {
    position: absolute;
    left: 1.25rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1.25rem;
    height: 1.25rem;
  }
  .btn:hover {
    transform: translateY(calc(-1 * var(--px)));
    box-shadow: 0 calc(3 * var(--px)) 0 0 var(--ink);
  }
  .btn:active {
    transform: translateY(var(--px));
    box-shadow: 0 0 0 0 var(--ink);
  }

  a:focus-visible {
    outline: 2px dashed var(--ink);
    outline-offset: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<main>
  <img class="avatar" src="avatar.jpg" alt="Foto de Felipe Bueno" width="400" height="400">
  <h1>Felipe Bueno</h1>
  <p class="bio">Engenheiro de dados — SP</p>


  <ul class="links">
    <li><a class="btn" href="https://www.linkedin.com/in/fcabueno/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="#22c55e"/>
      </svg>
      <span>LinkedIn</span>
    </a></li>
    <li><a class="btn" href="https://www.instagram.com/fcabueno/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="#22c55e"/>
      </svg>
      <span>Instagram</span>
    </a></li>
    <li><a class="btn" href="https://tinder.com/@fcabueno" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="#22c55e"/>
      </svg>
      <span>Tinder</span>
    </a></li>
  </ul>
</main>
</body>
</html>
